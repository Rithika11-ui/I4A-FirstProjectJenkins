<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midterm 2026 - Phe Rithika</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
        }
        .subject-badge {
            display: inline-block;
            background: linear-gradient(90deg, #e94560, #0f3460);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, #e94560, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 40px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .info-box .label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e94560;
            margin-bottom: 8px;
        }
        .info-box .value {
            font-size: 18px;
            font-weight: 600;
        }
        .url-box {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 14px;
            color: #e94560;
            word-break: break-all;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="subject-badge">🚀 DevOps</div>
        <h1>Midterm 2026</h1>
        <p class="subtitle">Deployed via Jenkins + Ansible</p>

        <div class="info-grid">
            <div class="info-box">
                <div class="label">Student Name</div>
                <div class="value">Phe Rithika</div>
            </div>
            <div class="info-box">
                <div class="label">Student ID</div>
                <div class="value">E20220245</div>
            </div>
            <div class="info-box">
                <div class="label">Subject</div>
                <div class="value">DevOps</div>
            </div>
            <div class="info-box">
                <div class="label">Year</div>
                <div class="value">2026</div>
            </div>
        </div>

        <div class="url-box">
            🌐 178.128.93.188/Midterm-2026/phe_rithika
        </div>

        <div class="footer">
            Rithika Institute · E20220245 · DevOps Midterm 2026
        </div>
    </div>
</body>
</html>
