version: '3.8'
services:
  jenkins:
    build:
      context: ./agent
      dockerfile: dockerfile
    image: jenkins-laravel:latest
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8086:8080"
      - "50000:50000"
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=ssh-rsa  msi@DESKTOP-I228BDP
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - jenkins_net

volumes:
  jenkins_home:
    driver: local

networks:
  jenkins_net:
    driver: bridge
