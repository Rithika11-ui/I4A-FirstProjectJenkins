version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_DATABASE: "A-PHE_Rithika-db"
      MYSQL_ROOT_PASSWORD: "Hello@123"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    restart: always
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/A-PHE_Rithika-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "Hello@123"
    ports:
      - "8443:8443"
      - "2222:2222"
    depends_on:
      - db

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "Hello@123"
    ports:
      - "8085:80"
    depends_on:
      - db

volumes:
  db_data:
