<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ID Card Generator - Profiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        /* Navbar Header styles matching your teacher's deployment */
        header.nav-header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 30px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .logo-svg {
            display: inline-block;
            vertical-align: middle;
        }

        nav.menu {
            display: flex;
            gap: 20px;
        }

        nav.menu a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav.menu a:hover, nav.menu a.active {
            color: #ffffff;
        }

        /* Content Container */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Card panels - split layout */
        .panel {
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            padding: 24px 30px;
            margin-bottom: 25px;
        }

        .panel-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .panel-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        /* Pill buttons matching screenshot */
        .btn {
            display: inline-block;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 9999px; /* Pill shaped */
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: 1px solid transparent;
        }

        .btn-primary-solid {
            background-color: #16a34a;
            color: #ffffff;
        }

        .btn-primary-solid:hover {
            background-color: #15803d;
        }

        .btn-primary-outline {
            border-color: #16a34a;
            color: #16a34a;
            background-color: transparent;
        }

        .btn-primary-outline:hover {
            background-color: #f0fdf4;
        }

        .btn-danger-solid {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-danger-solid:hover {
            background-color: #b91c1c;
        }

        /* Table styles */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 12px 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            color: #334155;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Semi-bold Name Cell */
        .profile-name-cell {
            font-weight: 600;
            color: #0f172a;
        }

        /* Type Badges */
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px; /* Pill shaped */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .badge-student {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge-employee {
            background-color: #d1fae5;
            color: #065f46;
        }

        .badge-user {
            background-color: #e2e8f0;
            color: #475569;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>

    <header class="nav-header">
        <div class="logo-container">
            <svg class="logo-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="16" rx="3" fill="url(#logo-grad)"/>
                <circle cx="8" cy="10" r="2.2" fill="#ffffff"/>
                <path d="M5 16C5 14.5 6.5 13.5 8 13.5C9.5 13.5 11 14.5 11 16" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="14" y1="9" x2="18" y2="9" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="14" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="14" y1="15" x2="17" y2="15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="logo-grad" x1="3" y1="4" x2="21" y2="20" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#22c55e"/>
                        <stop stop-color="#15803d"/>
                    </linearGradient>
                </defs>
            </svg>
            <span>ID Card Generator</span>
        </div>
        <nav class="menu">
            <a href="/profiles" class="active">Profiles</a>
            <a href="/profiles/new">New Profile</a>
            <a href="/templates">Templates</a>
            <a href="/batch-export">Batch Export</a>
        </nav>
    </header>

    <div class="container">
        <!-- Title Panel -->
        <div class="panel">
            <div class="panel-header-row">
                <div class="panel-title">Profiles</div>
                <a href="/profiles/new" class="btn btn-primary-solid">+ New Profile</a>
            </div>
        </div>

        <!-- Table Panel -->
        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Reg. No.</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Department</th>
                        <th>Template</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${profiles}">
                        <td th:text="${p.registrationNumber}">2026-STU-001</td>
                        <td th:text="${p.fullName}" class="profile-name-cell">John Doe</td>
                        <td>
                            <span th:if="${p.type.name() == 'STUDENT'}" class="badge badge-student">STUDENT</span>
                            <span th:if="${p.type.name() == 'EMPLOYEE'}" class="badge badge-employee">EMPLOYEE</span>
                            <span th:if="${p.type.name() == 'USER'}" class="badge badge-user">USER</span>
                        </td>
                        <td th:text="${p.department != null && !p.department.isEmpty() ? p.department : 'N/A'}">Engineering</td>
                        <td th:text="${p.template != null ? p.template.name : 'Default Theme'}">Default Theme</td>
                        <td class="actions-cell">
                            <a th:href="@{/api/profiles/{id}/preview(id=${p.id})}" target="_blank" class="btn btn-primary-outline">Card</a>
                            <a th:href="@{/profiles/edit/{id}(id=${p.id})}" class="btn btn-primary-outline">Edit</a>
                            <a th:href="@{/api/profiles/{id}/pdf(id=${p.id})}" class="btn btn-primary-solid">PDF</a>
                            <a th:href="@{/profiles/delete/{id}(id=${p.id})}" onclick="return confirm('Are you sure you want to delete this profile?')" class="btn btn-danger-solid">Delete</a>
                        </td>
                    </tr>
                    <tr th:if="${profiles.isEmpty()}">
                        <td colspan="6" style="text-align: center; color: #64748b; padding: 40px;">No profiles found. Click "+ New Profile" to create one.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
